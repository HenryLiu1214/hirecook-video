<!doctype html>
<html><head><meta charset="utf-8"><title>P × E diagram glyph</title><link rel="stylesheet" href="_shared.css">
<style>
  .stage { background: var(--bg-surface); border: 1px solid var(--line-hairline); border-radius: 8px; padding: 22px; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 28px; }
  .legend { display: flex; flex-direction: column; gap: 10px; }
  .legend .item { display: flex; align-items: center; gap: 10px; font: 500 12px/1 'Inter',sans-serif; color: var(--fg-secondary); }
  .legend .item .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
  .legend .item .ring { width: 12px; height: 12px; border-radius: 999px; border: 1.5px solid #00B4D8; box-shadow: 0 0 6px rgba(0,180,216,0.35); flex: none; }
  .formula { font: 600 18px/1 'Inter',sans-serif; letter-spacing: -0.01em; color: var(--fg-primary); margin-top: 12px; }
  .formula .dim { color: var(--fg-faint); font-weight: 400; }
</style></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom: 12px;">Diagram glyph · reusable lattice from the brand mark</div>
  <div class="stage">
    <svg width="160" height="160" viewBox="0 0 64 64" fill="none">
      <defs>
        <radialGradient id="gG" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#6FE3F5" stop-opacity="0.9"/>
          <stop offset="60%" stop-color="#2151F5" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#2151F5" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect x="3" y="3" width="58" height="58" rx="6" stroke="#2151F5" stroke-width="1.5" opacity="0.55"/>
      <g fill="#2151F5" opacity="0.45">
        <circle cx="16" cy="16" r="1.6"/><circle cx="32" cy="16" r="1.6"/><circle cx="48" cy="16" r="1.6"/>
        <circle cx="16" cy="32" r="1.6"/><circle cx="48" cy="32" r="1.6"/>
        <circle cx="16" cy="48" r="1.6"/><circle cx="32" cy="48" r="1.6"/><circle cx="48" cy="48" r="1.6"/>
      </g>
      <circle cx="32" cy="32" r="14" fill="url(#gG)"/>
      <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#2151F5"/>
      <rect x="44" y="44" width="8" height="8" rx="1.5" fill="#2151F5"/>
      <path d="M20 20 L32 32 L44 44" stroke="#00B4D8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="3.4" fill="#FFFFFF" stroke="#00B4D8" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="1.2" fill="#00B4D8"/>
    </svg>
    <div class="legend">
      <div class="item"><span class="swatch" style="background:#2151F5"></span>P · Personality node</div>
      <div class="item"><span class="swatch" style="background:#2151F5"></span>E · Environment node</div>
      <div class="item"><span class="ring"></span>B · Predicted behavior</div>
      <div class="item" style="color: var(--fg-faint);"><span class="swatch" style="background:#2151F5; opacity:0.45; border-radius:999px;"></span>Candidate / role population</div>
      <div class="formula">B = f<span class="dim">(P, E)</span></div>
    </div>
  </div>
</div></body></html>
