<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="_shared.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  .lbl { font: 500 10px/1 var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--fg-muted); margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: var(--bg-surface); border: 1px solid var(--line-hairline); border-radius: 6px; }
  .tile svg { width: 20px; height: 20px; color: var(--fg-secondary); stroke-width: 1.5; }
  .tile span { font: 400 9px/1 var(--font-mono); color: var(--fg-faint); text-align: center; }
  .row3 { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
  .row3 svg { stroke-width: 1.5; }
  .meta { font: 400 11px/1.4 'Inter',sans-serif; color: var(--fg-muted); }
</style></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom: 10px;">Iconography · Lucide · outline · 1.5 px stroke</div>
  <div class="grid">
    <div class="tile"><i data-lucide="activity"></i><span>activity</span></div>
    <div class="tile"><i data-lucide="brain-circuit"></i><span>brain-circuit</span></div>
    <div class="tile"><i data-lucide="bar-chart-3"></i><span>chart</span></div>
    <div class="tile"><i data-lucide="layers"></i><span>layers</span></div>
    <div class="tile"><i data-lucide="signal"></i><span>signal</span></div>
    <div class="tile"><i data-lucide="users"></i><span>users</span></div>
    <div class="tile"><i data-lucide="shield-check"></i><span>shield</span></div>
    <div class="tile"><i data-lucide="git-branch"></i><span>branch</span></div>
    <div class="tile"><i data-lucide="search"></i><span>search</span></div>
    <div class="tile"><i data-lucide="settings-2"></i><span>settings</span></div>
  </div>
  <div class="row3">
    <span class="lbl" style="margin: 0;">SIZES</span>
    <i data-lucide="activity" style="width: 14px; height: 14px; color: var(--fg-secondary);"></i>
    <i data-lucide="activity" style="width: 16px; height: 16px; color: var(--fg-secondary);"></i>
    <i data-lucide="activity" style="width: 20px; height: 20px; color: var(--fg-secondary);"></i>
    <i data-lucide="activity" style="width: 24px; height: 24px; color: var(--fg-secondary);"></i>
    <span class="meta">14 · 16 · 20 · 24 px</span>
    <span style="flex:1"></span>
    <i data-lucide="activity" style="width: 20px; height: 20px; color: #2151F5;"></i>
    <span class="meta">brand-blue · active</span>
  </div>
  <script>lucide.createIcons();</script>
</div></body></html>
