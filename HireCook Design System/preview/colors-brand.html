<!doctype html>
<html><head><meta charset="utf-8"><title>Primary Brand Scale</title><link rel="stylesheet" href="_shared.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 0; border-radius: 8px; overflow: hidden; border: 1px solid var(--line-hairline); }
  .swatch { aspect-ratio: 1 / 1.4; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; }
  .swatch .num { color: rgba(255,255,255,0.85); letter-spacing: 0.06em; }
  .swatch .hex { color: rgba(255,255,255,0.65); font-size: 9px; }
  .swatch.dark .num, .swatch.dark .hex { color: rgba(255,255,255,0.95); }
  .swatch.light .num, .swatch.light .hex { color: rgba(0,0,0,0.7); }
  .legend { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .primary-pill { background: var(--accent-brand); color: white; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-family: var(--font-mono); }
</style></head>
<body><div class="card">
  <div class="row" style="margin-bottom: 14px;">
    <span class="eyebrow">Deep Intelligence Blue · brand primary</span>
    <span class="grow"></span>
    <span class="primary-pill">500 · #2151F5</span>
  </div>
  <div class="scale">
    <div class="swatch light" style="background: #EAF0FF"><span class="num">50</span><span class="hex">#EAF0FF</span></div>
    <div class="swatch light" style="background: #CFDCFF"><span class="num">100</span><span class="hex">#CFDCFF</span></div>
    <div class="swatch light" style="background: #9CB6FF"><span class="num">200</span><span class="hex">#9CB6FF</span></div>
    <div class="swatch light" style="background: #6A8FFF"><span class="num">300</span><span class="hex">#6A8FFF</span></div>
    <div class="swatch dark"  style="background: #436BFB"><span class="num">400</span><span class="hex">#436BFB</span></div>
    <div class="swatch dark"  style="background: #2151F5; box-shadow: inset 0 0 0 2px #6FE3F5;"><span class="num">500</span><span class="hex">#2151F5</span></div>
    <div class="swatch dark"  style="background: #1A40C9"><span class="num">600</span><span class="hex">#1A40C9</span></div>
    <div class="swatch dark"  style="background: #1430A0"><span class="num">700</span><span class="hex">#1430A0</span></div>
    <div class="swatch dark"  style="background: #0F2476"><span class="num">800</span><span class="hex">#0F2476</span></div>
    <div class="swatch dark"  style="background: #0A1850"><span class="num">900</span><span class="hex">#0A1850</span></div>
    <div class="swatch dark"  style="background: #060F33"><span class="num">950</span><span class="hex">#060F33</span></div>
  </div>
  <div class="legend">
    <span class="eyebrow" style="color: var(--fg-faint)">Use</span>
    <span style="font-size: 12px; color: var(--fg-secondary)">500 — primary action · 400 — hover · 600 — press · 700+ — quiet backgrounds · 50–200 — light-mode tints</span>
  </div>
</div></body></html>
