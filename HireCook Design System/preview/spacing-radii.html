<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="_shared.css">
<style>
  .row3 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .tile { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .box { width: 100%; height: 64px; background: linear-gradient(135deg, #1A40C9, #2151F5); border: 1px solid rgba(255,255,255,0.1); }
  .name { font: 500 11px/1 var(--font-mono); color: var(--fg-secondary); }
  .desc { font: 400 10px/1.2 var(--font-mono); color: var(--fg-faint); }
</style></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom: 12px;">Corner radii · small, deliberate</div>
  <div class="row3">
    <div class="tile"><div class="box" style="border-radius: 0;"></div><div class="name">r-0</div><div class="desc">0 · canvas edge</div></div>
    <div class="tile"><div class="box" style="border-radius: 3px;"></div><div class="name">r-xs</div><div class="desc">3 · inputs</div></div>
    <div class="tile"><div class="box" style="border-radius: 6px;"></div><div class="name">r-sm</div><div class="desc">6 · buttons</div></div>
    <div class="tile"><div class="box" style="border-radius: 8px;"></div><div class="name">r-md</div><div class="desc">8 · cards</div></div>
    <div class="tile"><div class="box" style="border-radius: 12px;"></div><div class="name">r-lg</div><div class="desc">12 · panels</div></div>
    <div class="tile"><div class="box" style="border-radius: 999px;"></div><div class="name">r-pill</div><div class="desc">∞ · chips only</div></div>
  </div>
</div></body></html>
