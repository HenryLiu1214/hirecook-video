<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="_shared.css">
<style>
  .row3 { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .name { width: 70px; font: 500 11px/1 var(--font-mono); color: var(--fg-secondary); }
  .px { width: 50px; font: 400 11px/1 var(--font-mono); color: var(--fg-faint); }
  .bar { height: 10px; background: var(--accent-brand); border-radius: 2px; }
</style></head>
<body><div class="card">
  <div class="eyebrow" style="margin-bottom: 10px;">Spacing scale · 4 px base unit</div>
  <div class="row3"><span class="name">sp-1</span><span class="px">4 px</span><div class="bar" style="width: 4px;"></div></div>
  <div class="row3"><span class="name">sp-2</span><span class="px">8 px</span><div class="bar" style="width: 8px;"></div></div>
  <div class="row3"><span class="name">sp-3</span><span class="px">12 px</span><div class="bar" style="width: 12px;"></div></div>
  <div class="row3"><span class="name">sp-4</span><span class="px">16 px</span><div class="bar" style="width: 16px;"></div></div>
  <div class="row3"><span class="name">sp-5</span><span class="px">20 px</span><div class="bar" style="width: 20px;"></div></div>
  <div class="row3"><span class="name">sp-6</span><span class="px">24 px</span><div class="bar" style="width: 24px;"></div></div>
  <div class="row3"><span class="name">sp-7</span><span class="px">32 px</span><div class="bar" style="width: 32px;"></div></div>
  <div class="row3"><span class="name">sp-8</span><span class="px">40 px</span><div class="bar" style="width: 40px;"></div></div>
  <div class="row3"><span class="name">sp-9</span><span class="px">48 px</span><div class="bar" style="width: 48px;"></div></div>
  <div class="row3"><span class="name">sp-10</span><span class="px">64 px</span><div class="bar" style="width: 64px;"></div></div>
  <div class="row3"><span class="name">sp-11</span><span class="px">80 px</span><div class="bar" style="width: 80px;"></div></div>
</div></body></html>
